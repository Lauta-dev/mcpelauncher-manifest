name: Native Build MCPelauncher Arch-Based (Silvermont)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CFLAGS: -march=silvermont -O3 -pipe -fno-plt
  CXXFLAGS: -march=silvermont -O3 -pipe -fno-plt

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    permissions:
      contents: write

    steps:
      - name: Install Arch Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            cmake \
            git \
            ccache \
            clang \
            ca-certificates \
            openssl \
            libuv \
            libzip \
            protobuf \
            libxrandr \
            libxinerama \
            libxcursor \
            libxi \
            libpng \
            libx11 \
            zlib \
            systemd-libs \
            libevdev \
            mesa \
            alsa-lib \
            libpulse \
            libxtst \
            libxkbcommon \
            wayland \
            wayland-protocols

      - name: Resolve submodule URLs to upstream repos
        run: git config --global url."https://github.com/minecraft-linux/".insteadOf "../"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-silvermont-${{ github.run_number }}
          restore-keys: |
            ccache-silvermont-

      - name: Checkout MCPelauncher
        uses: actions/checkout@v4
        with:
          repository: Lauta-dev/mcpelauncher-manifest
          ref: ng
          path: mcpelauncher
          submodules: recursive

      - name: Build MCPelauncher Client
        run: |
          cmake -B build -S mcpelauncher \
            -DCMAKE_BUILD_TYPE=Release \
            -DJNI_USE_JNIVM=ON \
            -DGAMEWINDOW_SYSTEM=SDL3 \
            -DBUILD_UI=OFF \
            -DBUILD_WEBVIEW=OFF \
            -DENABLE_DEV_PATHS=OFF \
            -DUSE_SNMALLOC=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

          cmake --build build -j$(nproc)
          ccache -s

      - name: Package
        run: |
          cmake --install build --prefix release
          find release -type f \( -executable -o -name "*.so*" \) -exec strip --strip-unneeded {} +
          cat > release/README.txt <<EOF
          MCPelauncher Client
          Built with:
          - SDL3 backend
          - Wayland support (when available)
          - Target CPU: Silvermont
          - snmalloc allocator

          Run: tar -xzf mcpelauncher-client-silvermont.tar.gz && ./release/bin/mcpelauncher-client
          EOF
          tar -czf mcpelauncher-client-silvermont.tar.gz release

      - name: Generate tag
        id: tag
        run: |
          echo "tag=v$(date +'%Y.%m.%d')" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: mcpelauncher-client-silvermont.tar.gz
