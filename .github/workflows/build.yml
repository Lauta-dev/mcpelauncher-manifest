name: Native Build MCPelauncher Arch-Based (Silvermont)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    permissions:
      contents: write

    steps:
      - name: Install Arch Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            cmake \
            git \
            clang \
            ca-certificates \
            openssl \
            curl \
            libuv \
            libzip \
            protobuf \
            libxrandr \
            libxinerama \
            libxcursor \
            libxi \
            libpng \
            libx11 \
            zlib \
            systemd-libs \
            libevdev \
            mesa \
            alsa-lib \
            libpulse \
            libxtst \
            libxkbcommon \
            wayland \
            wayland-protocols \
            sdl3

      - name: Checkout MCPelauncher
        uses: actions/checkout@v4
        with:
          repository: minecraft-linux/mcpelauncher-manifest
          ref: qt6
          path: mcpelauncher
          submodules: recursive

      - name: Build MCPelauncher Client
        run: |
          cd mcpelauncher
          mkdir build
          cd build

          export CFLAGS="-march=silvermont -O2 -pipe"
          export CXXFLAGS="-march=silvermont -O2 -pipe"

          CC=clang CXX=clang++ cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DJNI_USE_JNIVM=ON \
            -DGAMEWINDOW_SYSTEM=SDL3 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

          cmake --build . -j$(nproc)

      - name: Create Release Package
        run: |
          mkdir -p release

          find mcpelauncher/build \
            -type f \
            -executable \
            -name "mcpelauncher-client" \
            -exec cp {} release/ \;

          cat > release/README.txt <<EOF
          MCPelauncher Client
          Built with:
          - SDL3 backend
          - Wayland support (when available)
          - Target CPU: Silvermont
          EOF

          tar -cvf mcpelauncher-client-silvermont.tar release

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: mcpelauncher-client-silvermont.tar
