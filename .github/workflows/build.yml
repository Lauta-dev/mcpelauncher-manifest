name: Native Build MCPelauncher (Qt6 + SDL3)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Client
        uses: actions/checkout@v4
        with:
          repository: minecraft-linux/mcpelauncher-manifest
          ref: qt6
          path: client-build
          submodules: recursive

      - name: Checkout UI
        uses: actions/checkout@v4
        with:
          repository: minecraft-linux/mcpelauncher-ui-manifest
          ref: qt6
          path: ui-build
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ clang cmake make git pkg-config ca-certificates \
            libssl-dev libpng-dev libx11-dev libxi-dev \
            libcurl4-openssl-dev libudev-dev libevdev-dev \
            libegl1-mesa-dev libasound2-dev libpulse-dev \
            qt6-base-dev qt6-webengine-dev qt6-declarative-dev \
            qt6-base-private-dev libqt6svg6-dev \
            libuv1-dev libzip-dev libprotobuf-dev protobuf-compiler \
            libxrandr-dev libxcursor-dev libxinerama-dev libxkbcommon-dev libwayland-dev

      - name: Build SDL3
        run: |
          git clone --depth 1 --branch release-3.2.x https://github.com/libsdl-org/SDL.git /tmp/SDL3
          cmake -S /tmp/SDL3 -B /tmp/SDL3/build -DCMAKE_INSTALL_PREFIX=/usr -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          sudo cmake --build /tmp/SDL3/build -j$(nproc)
          sudo cmake --install /tmp/SDL3/build

      - name: Build Client
        run: |
          cd client-build
          mkdir build && cd build
          export CFLAGS="-march=silvermont -O2 -pipe"
          export CXXFLAGS="-march=silvermont -O2 -pipe"
          CC=clang CXX=clang++ cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DJNI_USE_JNIVM=ON \
            -DGAMEWINDOW_SYSTEM=SDL3
          make -j$(nproc)

      - name: Build UI
        run: |
          cd ui-build
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DGAME_LAUNCHER_PATH=$(pwd)/../../client-build/build
          make -j$(nproc)

      - name: Create Release Package
        run: |
          mkdir -p mcpelauncher-silvermont
          # Copia el cliente
          cp client-build/build/mcpelauncher-client mcpelauncher-silvermont/ || echo "Client not found"
          # Copia la UI (busca ambos nombres posibles)
          cp ui-build/build/mcpelauncher-ui* mcpelauncher-silvermont/ || echo "UI not found"
          
          echo "Built for Celeron N2807 (Silvermont)" > mcpelauncher-silvermont/readme.txt
          tar -cvf mcpelauncher-native.tar mcpelauncher-silvermont/

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: mcpelauncher-native.tar
